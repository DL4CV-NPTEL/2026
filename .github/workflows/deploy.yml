name: Build and deploy Jupyter Book

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required by actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          # The pip cache looks for requirements.txt by default; point it here.
          cache-dependency-path: requirements-docs.txt

      # NOTE: Pages must be enabled once by hand, in
      #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
      # The workflow token cannot enable it: that needs repo-admin rights.

      - name: Install Jupyter Book
        run: pip install -r requirements-docs.txt

      # _config.yml sets execute_notebooks: "off", so the build uses the
      # outputs committed in each notebook. Nothing is executed here, which is
      # why torch / scikit-image are not needed on the runner.
      - name: Build the book
        run: jupyter-book build . --path-output .

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
